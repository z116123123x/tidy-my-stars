name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 24
    env:
      npm_config_engine_strict: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skills/explain-my-stars/site/package-lock.json
      - name: Install bundled report dependencies
        run: npm ci
        working-directory: skills/explain-my-stars/site
      - name: Test skill scripts and contracts
        run: node --test tests/explain-my-stars/*.test.mjs tests/tidy-my-stars/*.test.mjs
      - name: Test bundled React system
        run: npm test
        working-directory: skills/explain-my-stars/site
      - name: Typecheck bundled React system
        run: npm run typecheck
        working-directory: skills/explain-my-stars/site
      - name: Build bundled React system
        run: npm run build
        working-directory: skills/explain-my-stars/site
